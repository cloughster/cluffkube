- name: "Run Kubectl apply against {{ yamlfile }}"
  block:
  - name: Copy file to a temp file
    copy:
       src: "{{ yamlfile }}"
       dest: "/tmp/{{ yamlfile | basename }}"

  - name: kubectl apply 
    shell: kubectl apply -f "/tmp/{{ yamlfile | basename }}"
    args:
      chdir: "/tmp"
    register: kcmd

  - debug:
      msg: "{{ kcmd.stdout }}" 

  - name: remove temp file
    file:
      path: "/tmp/{{ yamlfile }}"
      state: absent
  run_once: true


